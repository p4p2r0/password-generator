[project]
name = "password-generator"
version = "0.1.1"
description = "Cryptographically secure password generator with quantum-resistant entropy margins"
readme = "README.md"
authors = [{ name = "p4p2r0", email = "294768138+p4p2r0@users.noreply.github.com" }]
requires-python = ">=3.10"
dependencies = ["pyperclip>=1.8"]

[project.scripts]
password-generator = "password_generator.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
